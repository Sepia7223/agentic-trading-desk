name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Strategy authority scan
        run: python -m pytest tests/test_strategy_portfolio_security.py

      - name: Resilience and analytics authority scan
        run: >-
          python -m pytest
          tests/test_resilience_preflight.py::test_resilience_package_has_no_operational_or_mutation_dependencies
          tests/test_allocation_engine.py::test_allocation_package_has_no_operational_dependencies
          tests/test_analytics_ledger_evidence.py::test_analytics_package_has_no_operational_or_mutation_dependencies

      - name: Secret and repository cleanliness scan
        run: python -m pytest tests/test_repository_hygiene.py

      - name: Architecture and dependency-direction scan
        run: python -m pytest tests/test_architecture_boundaries.py

      - name: Software bill of materials
        run: |
          python -m pip install cyclonedx-bom || true
          cyclonedx-py environment --output-format json --outfile sbom.json \
            || python -m pip freeze > sbom.txt
          echo "SBOM generated"

      - name: Dependency vulnerability scan
        continue-on-error: true
        run: python -m pip_audit --strict --desc on

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test frontend end to end
        working-directory: frontend
        run: npm run test:e2e

      - name: Check diff whitespace
        run: git diff --check

      - name: Check working tree is clean of build artifacts
        run: |
          git clean -ndx | grep -Ev '^Would (skip|remove) (node_modules|\.venv|frontend/node_modules)' > /tmp/untracked || true
          if [ -s /tmp/untracked ]; then
            echo "Unexpected build artifacts present:"; cat /tmp/untracked; exit 1
          fi
