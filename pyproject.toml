[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-trading-desk"
version = "0.1.0"
description = "Safety-first automated trading foundation with deterministic strategy calculations."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Oft3r" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
trading-desk-indicators = "trading_desk.strategy.indicators:main"
trading-desk-score = "trading_desk.strategy.score:main"
trading-desk-macro-pillar = "trading_desk.strategy.macro_pillar:main"
ig-trader = "trading_desk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E701"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["trading_desk"]
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false
